<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>TABLE</title>
    
</head>
<body>
    <table border="2">
        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2">Monday</th>
                <th rowspan="2">8:00 a.m</th>
                <th rowspan="2">05:00 p.m</th>
                <th>Introduction to XML</th>
            </tr>
            <tr>
                <th>Validity,DTD and Relax NG</th>
            </tr>
            <tr>
                <th rowspan="3">Tuesday</th>
                <th>08:00 a.m</th>
                <th>11:00 a.m</th>
                <th rowspan="1.5">XPath</th>
            </tr>
            <tr>
                <th>11:00 a.m</th>
                <th>02:00 p.m</th>
                <th rowspan="1.5">XSL Transforamtion</th>
            </tr>
            <tr>
                <th>02:00 p.m</th>
                <th>05:00 p.m</th>
            </tr>
            <tr>
                <th>Wednesday</th>
                <th>08:00 a.m</th>
                <th>12:00 p.m</th>
                <th>XAL Formatting Objects</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
